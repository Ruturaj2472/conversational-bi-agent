# ─────────────────────────────────────────────────────────────────────────────
# Conversational BI Agent - Docker Compose
#
# Full stack: PostgreSQL, Northwind data loader, MLflow, FastAPI agent, Streamlit UI.
#
#   1. cp .env.example .env   (set OPENAI_API_KEY and POSTGRES_PASSWORD)
#   2. docker compose up --build
#
#   UI      → http://localhost:8501
#   API     → http://localhost:8000/docs
#   MLflow  → http://localhost:5000
# ─────────────────────────────────────────────────────────────────────────────

x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
  image: conversational-bi-agent:latest

services:

  # ── PostgreSQL (business data + conversation memory) ──────────────────────
  postgres:
    image: postgres:16
    container_name: bi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-northwind}
      MEMORY_POSTGRES_DB: ${MEMORY_POSTGRES_DB:-agent_memory}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ── One-off job: load the Northwind sample database ──────────────────────
  db-loader:
    <<: *app-image
    container_name: bi-db-loader
    command: ["python", "scripts/load_northwind.py"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-northwind}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── MLflow tracking server ────────────────────────────────────────────────
  mlflow:
    <<: *app-image
    container_name: bi-mlflow
    user: root
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=/mlflow/artifacts
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # ── Conversational BI Agent (FastAPI + LangGraph) ─────────────────────────
  bi-agent:
    <<: *app-image
    container_name: bi-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MEMORY_POSTGRES_HOST: postgres
      MEMORY_POSTGRES_PORT: 5432
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      db-loader:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    restart: unless-stopped

  # ── Streamlit UI ──────────────────────────────────────────────────────────
  bi-ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: bi-ui
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://bi-agent:8000
    depends_on:
      bi-agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  mlflow-data:
